<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>离线示例会话</title
  ><style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      height: 100%;
      font:
        15px/1.5 'Microsoft YaHei',
        Arial,
        sans-serif;
      color: #25303d;
    }
    #main {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #efeae2;
    }
    header {
      height: 66px;
      padding: 10px 20px;
      background: #f6f7f8;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #e1dfdc;
      flex-shrink: 0;
    }
    .avatar {
      width: 40px;
      height: 40px;
      background: #d4e9e1;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #4b7c6b;
      font-weight: 700;
      font-size: 15px;
    }
    .name {
      font-size: 15px;
      font-weight: 600;
    }
    .subtitle {
      font-size: 11px;
      color: #85908f;
    }
    .header-actions {
      margin-left: auto;
      color: #8c949c;
      font-size: 24px;
      letter-spacing: 14px;
    }
    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      background: radial-gradient(
          circle at 18% 34%,
          #fff4 1px,
          transparent 1.7px
        )
        0 0/24px 24px;
    }
    .date {
      align-self: center;
      font-size: 10px;
      letter-spacing: 1px;
      color: #8b9095;
      padding: 3px 9px;
      background: #ffffff9c;
      border-radius: 4px;
      margin-bottom: 0;
    }
    .message-in,
    .message-out {
      max-width: 91%;
      width: fit-content;
      padding: 12px 14px 9px;
      border-radius: 7px;
      background: #fff;
      position: relative;
      box-shadow: 0 1px 1px #4e44331a;
      word-break: break-word;
    }
    .message-out {
      align-self: flex-end;
      background: #d9f5c7;
    }
    .time {
      display: block;
      font-size: 10px;
      text-align: right;
      color: #9ba09e;
      margin-top: 5px;
    }
    .message-in .selectable-text,
    .message-out .selectable-text {
      white-space: pre-wrap;
      font-size: 14px;
    }
    footer {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #f5f6f7;
      flex-shrink: 0;
      border-top: 1px solid #e1dfdc;
    }
    .plus {
      font-size: 28px;
      color: #8d979e;
      line-height: 1;
    }
    .input-shell {
      background: white;
      border: 1px solid #e4e7e9;
      flex: 1;
      border-radius: 8px;
      padding: 11px 13px;
      min-height: 46px;
    }
    .input-shell [contenteditable] {
      outline: 0;
      min-height: 22px;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .input-shell [contenteditable]:empty:before {
      content: '输入消息';
      color: #a0a8b0;
    }
    .send {
      background: #3b8f78;
      border: 0;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: white;
      font-size: 18px;
    }
    .history-note {
      text-align: center;
      color: #8a8e8f;
      font-size: 11px;
    }
    .history-old {
      display: none;
    }
  </style>
  <div id="main">
    <header>
      <div class="avatar">AM</div>
      <div>
        <div class="name" title="Alex Morgan · 示例联系人">Alex Morgan</div>
        <div class="subtitle">项目评审 · 离线示例会话</div>
      </div>
      <div class="header-actions">⌕ ⋮</div>
    </header>
    <div class="messages">
      <div class="date">今天 · 项目评审</div>
      <div class="message-in">
        <span class="selectable-text copyable-text" data-testid="msg-text"
          >Hi! Are we still on for the project review tomorrow?</span
        ><span class="time">10:24</span>
      </div>
      <div class="message-out">
        <span class="selectable-text copyable-text" data-testid="msg-text"
          >Yes, 2 pm works for me.</span
        ><span class="time">10:25 ✓✓</span>
      </div>
      <div class="message-in">
        <span class="selectable-text copyable-text" data-testid="msg-text"
          >Perfect. Could you send the agenda before the meeting?</span
        ><span class="time">10:26</span>
      </div>
    </div>
    <footer>
      <span class="plus">＋</span>
      <div class="input-shell">
        <div
          contenteditable="true"
          role="textbox"
          data-tab="10"
          aria-label="输入消息"
        ></div>
      </div>
      <button class="send" data-testid="compose-btn-send" aria-label="发送消息">
        <span data-icon="send">➤</span>
      </button>
    </footer>
  </div>
</html>
