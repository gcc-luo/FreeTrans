name: Release FreeTrans Desktop

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-macos:
    name: Build signed macOS packages
    runs-on: macos-14
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify-version "${{ github.ref_name }}"
      - name: Require macOS signing credentials
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ]; then
            echo 'Configure CSC_LINK and CSC_KEY_PASSWORD as GitHub Actions secrets for macOS auto-updates.' >&2
            exit 1
          fi
      - run: pnpm build:release:mac
      - run: pnpm release:verify-artifacts mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: |
            out/*.dmg
            out/*.zip
            out/*.blockmap
            out/latest-mac.yml

  build-windows:
    name: Build Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify-version "${{ github.ref_name }}"
      - run: pnpm build:release:win
      - run: pnpm release:verify-artifacts win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            out/*.exe
            out/*.blockmap
            out/latest.yml

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm release:verify-version "${{ github.ref_name }}"
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts/mac
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/win
      - run: pnpm release:verify-artifacts mac artifacts/mac
      - run: pnpm release:verify-artifacts win artifacts/win
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/mac/*.dmg
            artifacts/mac/*.zip
            artifacts/mac/*.blockmap
            artifacts/mac/latest-mac.yml
            artifacts/win/*.exe
            artifacts/win/*.blockmap
            artifacts/win/latest.yml
