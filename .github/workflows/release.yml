name: Release FreeTrans Desktop

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }} installer
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK == '' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify-version "${{ github.ref_name }}"
      - name: Build macOS installer
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          pnpm build:release:mac --${{ matrix.arch }}
      - run: pnpm release:verify-artifacts mac out ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.arch }}
          if-no-files-found: error
          path: out/*.dmg

  build-windows:
    name: Build Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify-version "${{ github.ref_name }}"
      - run: pnpm build:release:win --x64
      - run: pnpm release:verify-artifacts win out x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: out/*.exe

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: pnpm release:verify-version "${{ github.ref_name }}"
      - uses: actions/download-artifact@v4
        with:
          name: macos-release-arm64
          path: artifacts/mac
      - uses: actions/download-artifact@v4
        with:
          name: macos-release-x64
          path: artifacts/mac
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/win
      - run: pnpm release:verify-artifacts mac artifacts/mac arm64
      - run: pnpm release:verify-artifacts mac artifacts/mac x64
      - run: pnpm release:verify-artifacts win artifacts/win x64
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/mac/*.dmg
            artifacts/win/*.exe
