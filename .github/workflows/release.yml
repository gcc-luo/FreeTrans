name: Release FreeTrans Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build with the current workflow'
        required: true
        type: string

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }} installer
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK == '' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify-version "$RELEASE_TAG"
      - name: Build macOS installer
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
          fi
          pnpm build:release:mac --${{ matrix.arch }}
      - run: pnpm release:verify-artifacts mac out ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.arch }}
          if-no-files-found: error
          path: out/*.dmg

  build-windows:
    name: Build Windows packages
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify-version $env:RELEASE_TAG
      - run: pnpm build:release:win --x64
      - run: pnpm release:verify-artifacts win out x64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: out/*.exe

  publish:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: pnpm release:verify-version "$RELEASE_TAG"
      - uses: actions/download-artifact@v4
        with:
          name: macos-release-arm64
          path: artifacts/mac
      - uses: actions/download-artifact@v4
        with:
          name: macos-release-x64
          path: artifacts/mac
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/win
      - run: pnpm release:verify-artifacts mac artifacts/mac arm64
      - run: pnpm release:verify-artifacts mac artifacts/mac x64
      - run: pnpm release:verify-artifacts win artifacts/win x64
      - name: Select version-specific release notes
        shell: bash
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          if [ -f "$notes" ]; then
            echo "RELEASE_NOTES_PATH=$notes" >> "$GITHUB_ENV"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: |
            artifacts/mac/*.dmg
            artifacts/win/*.exe
